<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Result Prediction</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.10);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 35px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 12px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            box-shadow: 0 0 0 2px #00c6ff;
        }

        .btn {
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: #00c6ff;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0072ff;
            transform: scale(1.03);
        }

        h2 {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.25);
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>FWI Prediction</h1>


        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <input type="text" name="Temperature" placeholder="Temperature" required="required" />

            <input type="text" name="RH" placeholder="RH" required="required" />

            <input type="text" name="Ws" placeholder="Ws" required="required" />

            <input type="text" name="Rain" placeholder="Rain" required="required" />

            <input type="text" name="FFMC" placeholder="FFMC" required="required" />

            <input type="text" name="DMC" placeholder="DMC" required="required" />

            <input type="text" name="ISI" placeholder="ISI" required="required" />

            <input type="text" name="Classes" placeholder="Classes" required="required" />

            <input type="text" name="Region" placeholder="Region" required="required" />

            <button type="submit" class="btn">
                Predict
            </button>

        </form>

        <h2>
            THE FWI prediction is {{result}}
        </h2>

    </div>

</body>

</html>
